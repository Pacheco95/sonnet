name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    name: Lint
    # A draft pull request skips every job: the others wait for lint. Marking it ready runs them.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check docs
        run: python3 tools/check_docs.py
      - name: Check the one-way module dependency rule
        run: python3 tools/check_dependencies.py
      - name: Check that vcpkg.json mirrors the CMake project version
        run: python3 tools/check_version.py
      # clang-format 20 alone from apt.llvm.org, without recommends (docs/build.md, "Linux packages").
      - name: Install clang-format 20
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          codename=$(lsb_release -cs)
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-20 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-20
          clang-format-20 --version
      - name: Check formatting
        run: git ls-files '*.h' '*.cpp' | xargs clang-format-20 --dry-run --Werror
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | python3 tools/check_commit_msg.py --stdin

  build:
    name: ${{ matrix.name }}
    needs: lint
    permissions:
      contents: read
      actions: write # deletes the vcpkg binary cache entries a new one replaces
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `cache` names the job's vcpkg binary cache group. vcpkg builds every port in Debug and Release
        # whatever CMAKE_BUILD_TYPE is, and the sanitizer flags do not reach the ports, so the jobs that
        # share a triplet and a compiler share a group.
        # `llvm` lists the LLVM 20 packages a Linux job installs from apt.llvm.org, `tidy` adds clang-tidy 20
        # on pull requests, and `lavapipe: false` leaves Mesa out (docs/build.md, "Linux packages").
        include:
          - name: Linux GCC
            cache: linux-gcc
            os: ubuntu-24.04
            preset: linux-debug
            cc: gcc-14
            cxx: g++-14
          - name: Linux Clang
            cache: linux-clang
            os: ubuntu-24.04
            preset: linux-debug
            cc: clang-20
            cxx: clang++-20
            llvm: clang-20 llvm-20
            tidy: true
          - name: Linux ASan
            cache: linux-clang
            os: ubuntu-24.04
            preset: linux-asan
            cc: clang-20
            cxx: clang++-20
            llvm: clang-20 llvm-20 libclang-rt-20-dev
          - name: Linux TSan
            cache: linux-tsan
            os: ubuntu-24.04
            preset: linux-tsan
            cc: clang-20
            cxx: clang++-20
            llvm: clang-20 llvm-20 libclang-rt-20-dev
            lavapipe: false
          - name: Windows MSVC
            cache: windows-msvc
            os: windows-latest
            preset: windows-debug
          - name: macOS Clang
            cache: macos
            os: macos-latest
            preset: macos-debug
          # Plain Release, not the presets' RelWithDebInfo: it compiles assertions out and GCC's -O3 inlining
          # reports places -O2 does not, and warnings are errors (#36).
          # One Release job per desktop builds the hook sample's game module into the player and the editor
          # and runs game_module_tests (ADR-0027); its generic tests still check that a binary without the
          # module refuses the project.
          - name: Linux GCC Release
            cache: linux-gcc
            os: ubuntu-24.04
            preset: linux-release
            build-type: Release
            game: apps/samples/hook
            cc: gcc-14
            cxx: g++-14
          - name: Linux Clang Release
            cache: linux-clang
            os: ubuntu-24.04
            preset: linux-release
            build-type: Release
            cc: clang-20
            cxx: clang++-20
            llvm: clang-20 llvm-20
          - name: Windows MSVC Release
            cache: windows-msvc
            os: windows-latest
            preset: windows-release
            build-type: Release
            game: apps/samples/hook
          - name: Windows clang-cl Release
            cache: windows-clang-cl
            os: windows-latest
            preset: windows-release
            build-type: Release
            cc: clang-cl
            cxx: clang-cl
          - name: macOS Clang Release
            cache: macos
            os: macos-latest
            preset: macos-release
            build-type: Release
            game: apps/samples/hook
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      # Linux packages (docs/build.md, "Linux packages"): each job installs what it uses, in steps of their own
      # so each one's time shows. Mesa comes from the kisak PPA, recent enough for Lavapipe to expose Vulkan
      # 1.4, in every job but TSan, whose test preset runs with no Vulkan driver. Only the Clang jobs add
      # apt.llvm.org, because Clang 18 with libstdc++ hides std::expected (docs/build.md, "Toolchains"). The
      # sources are added without an index update of their own, so apt reads the indexes once.
      - name: Add the Linux package sources
        if: runner.os == 'Linux'
        env:
          LAVAPIPE: ${{ matrix.lavapipe }}
          LLVM: ${{ matrix.llvm }}
        run: |
          if [ "$LAVAPIPE" != false ]; then
            sudo add-apt-repository -y --no-update ppa:kisak/kisak-mesa
          fi
          if [ -n "$LLVM" ]; then
            sudo install -d -m 0755 /etc/apt/keyrings
            sudo wget -qO /etc/apt/keyrings/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
            codename=$(lsb_release -cs)
            echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-20 main" \
              | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list
          fi
          sudo apt-get update

      # GCC 14 is the GCC jobs' compiler and the libstdc++ 14 Clang picks up on its own. SDL3 and miniaudio
      # compile against the system's window and audio headers.
      - name: Install the Linux packages
        if: runner.os == 'Linux'
        env:
          LAVAPIPE: ${{ matrix.lavapipe }}
        run: |
          mesa=
          if [ "$LAVAPIPE" != false ]; then
            mesa="mesa-vulkan-drivers vulkan-tools"
          fi
          sudo apt-get install -y ninja-build gcc-14 g++-14 libvulkan1 $mesa \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      # Without recommends, which for clang-20 are llvm-20-dev and clang-tools-20, used by no job. llvm-20
      # holds the llvm-ar-20 and llvm-ranlib-20 CMake picks for Clang, and the llvm-symbolizer-20 the
      # sanitizer runtimes run to name a report's frames, which tools/tsan.supp matches. The sanitizer jobs
      # add libclang-rt-20-dev, the runtimes, which clang-20 only recommends; the clang-tidy step's job adds
      # clang-tidy 20 on pull requests, the only time that step runs.
      - name: Install LLVM 20
        if: matrix.llvm
        env:
          LLVM: ${{ matrix.llvm }}
          TIDY: ${{ matrix.tidy && github.event_name == 'pull_request' }}
        run: |
          packages="$LLVM"
          if [ "$TIDY" = true ]; then
            packages="$packages clang-tidy-20"
          fi
          sudo apt-get install -y --no-install-recommends $packages

      # Vulkan tests run on Lavapipe; tests that need a window use SDL's offscreen driver. A Vulkan test
      # skips itself without a device, so the job stops here if Lavapipe is missing or below 1.4 rather
      # than pass with the GPU cases skipped.
      - name: Select Lavapipe and print the tool versions
        if: runner.os == 'Linux'
        env:
          LAVAPIPE: ${{ matrix.lavapipe }}
          LLVM: ${{ matrix.llvm }}
        run: |
          echo "ninja $(ninja --version)"
          "$CC" --version | head -1
          if [ "$CC" != gcc-14 ]; then
            gcc-14 --version | head -1
            "$CXX" -v -E -x c++ /dev/null 2>&1 | grep 'Selected GCC installation' || true
          fi
          if command -v clang-tidy-20 > /dev/null; then
            clang-tidy-20 --version | grep version
          fi
          dpkg-query -W -f='${db:Status-Abbrev} ${Package} ${Version}\n' \
            $LLVM clang-tidy-20 libllvm20 mesa-vulkan-drivers 2> /dev/null | grep '^ii' || true
          if [ "$LAVAPIPE" = false ]; then
            echo "No Lavapipe: the ${{ matrix.preset }} test preset runs with no Vulkan driver"
            exit 0
          fi
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          summary=$(VK_DRIVER_FILES="$icd" vulkaninfo --summary 2>&1) || true
          grep -E 'apiVersion|driverInfo|deviceName' <<< "$summary" || true
          if ! grep -qE 'deviceName += llvmpipe' <<< "$summary" || ! grep -qE 'apiVersion += 1\.4\.' <<< "$summary"; then
            echo "::error::Lavapipe ($icd) gives no Vulkan 1.4 device"
            echo "$summary"
            exit 1
          fi

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows packages
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        shell: bash
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's binary cache (docs/build.md, "vcpkg binary cache"): the files backend in a folder restored
      # from the newest entry of the job's group, which pull requests read from main.
      # The runner image version is part of the key: hosted runners serve two image versions at the same
      # time while one rolls out, and their compilers and SDKs give the ports different ABI hashes. The
      # runner sets `ImageVersion` as an environment variable, which expressions cannot read, so it goes
      # through GITHUB_ENV first.
      # SCCACHE_GROUP names the job's compiler cache: one per preset and compiler, since each job builds
      # with its own flags and objects never carry over between them.
      - name: Note the runner image
        shell: bash
        run: |
          echo "RUNNER_IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
          echo "SCCACHE_GROUP=sccache-${{ matrix.preset }}-${CC:-default}" >> "$GITHUB_ENV"

      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-
            vcpkg-${{ matrix.cache }}-

      - name: Point vcpkg at the binary cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          touch "$RUNNER_TEMP/vcpkg-cache.marker"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # Compiler cache (docs/build.md, "Compiler cache"): sccache's local disk cache in a folder restored
      # from the newest entry of the job's group, which pull requests read from main. Each of these steps
      # may fail without failing the job: Configure only gets the compiler launcher once sccache started.
      - name: Install sccache
        id: sccache-install
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      - name: Restore the compiler cache
        if: steps.sccache-install.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ env.SCCACHE_GROUP }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.SCCACHE_GROUP }}-${{ env.RUNNER_IMAGE }}-
            ${{ env.SCCACHE_GROUP }}-

      # No idle timeout, so the server outlives a long vcpkg install between Configure and Build, and an
      # I/O error with the server makes the client compile without it. MSVC's /Zi writes a shared PDB
      # sccache cannot cache, so Windows embeds the debug information in each object (/Z7) instead.
      - name: Start sccache
        id: sccache
        if: steps.sccache-install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sccache"
          touch "$RUNNER_TEMP/sccache.marker"
          for setting in "SCCACHE_DIR=$RUNNER_TEMP/sccache" SCCACHE_CACHE_SIZE=2G SCCACHE_IDLE_TIMEOUT=0 \
            SCCACHE_IGNORE_SERVER_IO_ERROR=1; do
            export "$setting"
            echo "$setting" >> "$GITHUB_ENV"
          done
          sccache --start-server
          args="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          if [ "$RUNNER_OS" = "Windows" ]; then
            args="$args -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          fi
          echo "cmake-args=$args" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.build-type && format('-DCMAKE_BUILD_TYPE={0}', matrix.build-type) || '' }} ${{ matrix.game && format('-DSONNET_GAME={0}', matrix.game) || '' }} ${{ steps.sccache.outputs.cmake-args }}

      # Saved right after the configure that installs the ports, so a failing build or test still saves it,
      # and only from main, so pull requests cannot evict main's entries. Pruned to the archives this
      # configure used, saved only if vcpkg wrote new ones, and then the older entries of the same group
      # and runner image are deleted.
      - name: Prune the vcpkg binary cache
        id: vcpkg-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: python3 tools/prune_vcpkg_cache.py "$RUNNER_TEMP/vcpkg-cache" --since "$RUNNER_TEMP/vcpkg-cache.marker"

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the older vcpkg binary caches
        if: steps.vcpkg-cache.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" --limit 100 --json id,key)
          # Only once the new entry is there, so a save that failed does not leave the group empty.
          if jq -e --arg key "$KEY" 'any(.key == $key)' <<< "$caches" > /dev/null; then
            jq -r --arg key "$KEY" '.[] | select(.key != $key) | .id' <<< "$caches" \
              | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::$KEY is not in the cache list; keeping the older entries"
          fi

      - name: Check the CMake target graph against the module order
        if: matrix.name == 'Linux GCC'
        run: |
          cmake --graphviz="$RUNNER_TEMP/graph/deps.dot" build/${{ matrix.preset }}
          python3 tools/check_dependencies.py --graphviz "$RUNNER_TEMP/graph/deps.dot"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The statistics also go to the run's summary page. Stopping the server flushes the cache folder.
      - name: Stop sccache
        id: sccache-stats
        if: ${{ !cancelled() && steps.sccache.outputs.cmake-args }}
        continue-on-error: true
        shell: bash
        run: |
          sccache --show-stats --stats-format json > "$RUNNER_TEMP/sccache-stats.json"
          { echo "### sccache, ${{ matrix.name }}"; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          sccache --stop-server
          echo "writes=$(jq '.stats.cache_writes' "$RUNNER_TEMP/sccache-stats.json")" >> "$GITHUB_OUTPUT"

      # Saved only from main, as the vcpkg cache is, and only if the build wrote objects. A hit sets the
      # object's modification time, so every file older than the marker went unused by this build and is
      # deleted first; the entry then holds one build's objects.
      - name: Prune the compiler cache
        id: sccache-cache
        if: >-
          steps.sccache-stats.outputs.writes != '' && steps.sccache-stats.outputs.writes != '0'
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/sccache" "$RUNNER_TEMP/sccache.marker" <<'EOF'
          import sys
          from pathlib import Path
          since = Path(sys.argv[2]).stat().st_mtime
          files = [f for f in Path(sys.argv[1]).rglob("*") if f.is_file()]
          unused = [f for f in files if f.stat().st_mtime <= since]
          for f in unused:
              f.unlink()
          size = sum(f.stat().st_size for f in files if f not in unused) / 2**20
          print(f"kept {len(files) - len(unused)} files ({size:.0f} MiB), removed {len(unused)} unused")
          EOF
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save the compiler cache
        if: steps.sccache-cache.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ env.SCCACHE_GROUP }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the older compiler caches
        if: steps.sccache-cache.outputs.save == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ env.SCCACHE_GROUP }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: ${{ env.SCCACHE_GROUP }}-${{ env.RUNNER_IMAGE }}-
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" --limit 100 --json id,key)
          # Only once the new entry is there, so a save that failed does not leave the group empty.
          if jq -e --arg key "$KEY" 'any(.key == $key)' <<< "$caches" > /dev/null; then
            jq -r --arg key "$KEY" '.[] | select(.key != $key) | .id' <<< "$caches" \
              | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::$KEY is not in the cache list; keeping the older entries"
          fi

      # Each Catch2 suite also writes a JUnit report of its cases' durations to build/<preset>/test-results/catch2
      # (cmake/SonnetFunctions.cmake), and CTest one of each suite's result, timeouts included, beside it.
      # Two suites at a time (docs/build.md, "Continuous integration"): each already runs Lavapipe's and the job
      # system's threads, so on four vCPUs a third one measured no faster. editor_tests starts first (its COST).
      - name: Test
        id: test
        run: ctest --preset ${{ matrix.preset }} --parallel 2 --timeout 300 --output-junit test-results/ctest.xml

      # Test timings (docs/build.md): after a failed or timed-out Test step too, and neither step changes the
      # job's result. The summary goes to the run's summary page and into the artifact with the reports and
      # CTest's full log.
      - name: Summarise the test timings
        if: always() && steps.test.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/test_timings.py "build/${{ matrix.preset }}/test-results" \
            --context "job=${{ matrix.name }}" --context "preset=${{ matrix.preset }}" \
            --context "revision=${{ github.event.pull_request.head.sha || github.sha }}" \
            --context "run=${{ github.run_id }}-${{ github.run_attempt }}" --context "runner=${{ env.RUNNER_IMAGE }}" \
            | tee "build/${{ matrix.preset }}/test-results/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the test results
        if: always() && steps.test.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.preset }}-${{ matrix.cc || 'default' }}
          path: |
            build/${{ matrix.preset }}/test-results
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: clang-tidy on changed files
        if: matrix.tidy && github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- '*.cpp' | grep -E '^(modules|apps)/' || true)
          if [ -n "$files" ]; then
            clang-tidy-20 -p build/${{ matrix.preset }} $files
          fi

  android:
    name: Android
    needs: lint
    permissions:
      contents: read
      actions: write # deletes the vcpkg binary cache entries a new one replaces
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # NDK r30 is the oldest that targets android-36, the presets' API level (docs/build.md, "Toolchains").
      # The runner's default, r27.3, stops at API 35, so r30 is installed next to it. GCC 14 and the SDL
      # headers are for the host build of sonnet_cook.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev
          ndk=30.0.16248370
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          grep Pkg.Revision "$ANDROID_HOME/ndk/$ndk/source.properties"

      # The APK takes javac, java and keytool from JAVA_HOME (docs/build.md, "Android"); pin the runner's JDK 17.
      - name: Check the JDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/javac" -version 2>&1 | tee /dev/stderr | grep -q '^javac 17\.'

      - name: Set up vcpkg
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's binary cache (docs/build.md, "vcpkg binary cache"): the files backend in a folder restored
      # from the newest entry of the job's group, which pull requests read from main.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-android-

      - name: Point vcpkg at the binary cache
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          touch "$RUNNER_TEMP/vcpkg-cache.marker"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # ADR-0018, "CI": the basic sample cooked for android by a Linux sonnet_cook, with ASTC textures.
      # Built here rather than taken from the Linux jobs, which would hold this job until the whole
      # matrix finished.
      - name: Build the host cook tool
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake --preset linux-release -DSONNET_BUILD_TESTS=OFF
          cmake --build --preset linux-release --target sonnet_cook_app

      - name: Cook the basic sample for Android
        run: build/linux-release/apps/cook/sonnet_cook apps/samples/basic --platform android --out build/android-bundle

      - name: Configure
        run: cmake --preset android-release -DSONNET_ANDROID_BUNDLE="$PWD/build/android-bundle/game.sbundle"

      # Saved right after the configure that installs the ports, so a failing build or test still saves it,
      # and only from main, so pull requests cannot evict main's entries. Pruned to the archives this
      # configure used, saved only if vcpkg wrote new ones, and then the group's older entries are deleted.
      - name: Prune the vcpkg binary cache
        id: vcpkg-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tools/prune_vcpkg_cache.py "$RUNNER_TEMP/vcpkg-cache" --since "$RUNNER_TEMP/vcpkg-cache.marker"

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-android-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the older vcpkg binary caches
        if: steps.vcpkg-cache.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: vcpkg-android-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: vcpkg-android-
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" --limit 100 --json id,key)
          # Only once the new entry is there, so a save that failed does not leave the group empty.
          if jq -e --arg key "$KEY" 'any(.key == $key)' <<< "$caches" > /dev/null; then
            jq -r --arg key "$KEY" '.[] | select(.key != $key) | .id' <<< "$caches" \
              | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::$KEY is not in the cache list; keeping the older entries"
          fi

      # The player library first, then the APK packaged from it with the cooked bundle.
      - name: Build
        run: cmake --build --preset android-release --target sonnet_player_app

      - name: Package the APK
        run: cmake --build --preset android-release --target sonnet_player_apk

      - name: Verify the APK
        run: |
          apk=build/android-release/apps/player/sonnet_player.apk
          tools="$ANDROID_HOME/build-tools/36.1.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt2" dump badging "$apk" | grep -E "^package|Sdk|vulkan|native-code"
          unzip -v "$apk" | grep -E ' Stored .* assets/game\.sbundle$'

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: sonnet_player-android
          path: build/android-release/apps/player/sonnet_player.apk
          if-no-files-found: error

  ios:
    name: iOS
    needs: lint
    permissions:
      contents: read
      actions: write # deletes the vcpkg binary cache entries a new one replaces
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS packages
        run: brew install ninja

      - name: Set up vcpkg
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's binary cache (docs/build.md, "vcpkg binary cache"): the files backend in a folder restored
      # from the newest entry of the job's group, which pull requests read from main.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-ios-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-ios-

      - name: Point vcpkg at the binary cache
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          touch "$RUNNER_TEMP/vcpkg-cache.marker"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # Built here, as the Android job builds sonnet_cook for its own host, so the iOS job stays
      # independent of the desktop matrix. This triplet (arm64-osx) shares the "ios" cache group
      # with arm64-ios, the same way the Android job's group holds x64-linux and arm64-android.
      - name: Build the host cook tool
        run: |
          cmake --preset macos-release -DSONNET_BUILD_TESTS=OFF
          cmake --build --preset macos-release --target sonnet_cook_app

      - name: Cook the basic sample for iOS
        run: build/macos-release/apps/cook/sonnet_cook apps/samples/basic --platform ios --out build/ios-bundle

      # ADR-0018, "CI": proves the player compiles and links against MoltenVK on the device SDK,
      # with a real cooked bundle so the SONNET_IOS_BUNDLE copy step in cmake/SonnetIOS.cmake runs
      # too, not just the shaders half of it. No CMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM is set, so
      # CODE_SIGNING_ALLOWED=NO skips the codesign build phase instead of failing for want of a
      # team; there is no simulator run, since the release's iOS archive MoltenVK links has no
      # simulator slice (ports/moltenvk).
      - name: Configure
        run: cmake --preset ios-release -DSONNET_IOS_BUNDLE="$PWD/build/ios-bundle/game.sbundle"

      # Saved right after the configure that installs the ports, so a failing build still saves it,
      # and only from main, so pull requests cannot evict main's entries. Pruned to the archives this
      # configure used, saved only if vcpkg wrote new ones, and then the group's older entries are deleted.
      - name: Prune the vcpkg binary cache
        id: vcpkg-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tools/prune_vcpkg_cache.py "$RUNNER_TEMP/vcpkg-cache" --since "$RUNNER_TEMP/vcpkg-cache.marker"

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-ios-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the older vcpkg binary caches
        if: steps.vcpkg-cache.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: vcpkg-ios-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: vcpkg-ios-
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" --limit 100 --json id,key)
          # Only once the new entry is there, so a save that failed does not leave the group empty.
          if jq -e --arg key "$KEY" 'any(.key == $key)' <<< "$caches" > /dev/null; then
            jq -r --arg key "$KEY" '.[] | select(.key != $key) | .id' <<< "$caches" \
              | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::$KEY is not in the cache list; keeping the older entries"
          fi

      - name: Build
        run: cmake --build --preset ios-release --target sonnet_player_app -- CODE_SIGNING_ALLOWED=NO

      - name: Verify the app bundle
        run: |
          app=build/ios-release/apps/player/RelWithDebInfo-iphoneos/sonnet_player.app
          echo "--- $app ---"; ls -la "$app" || true
          echo "--- $app/shaders ---"; ls -la "$app/shaders" 2>&1 || true
          echo "--- every sonnet_player.app under build/ios-release ---"; find build/ios-release -iname 'sonnet_player.app'
          echo "--- every game.sbundle under build/ios-release ---"; find build/ios-release -iname 'game.sbundle'
          echo "--- every *.spv under build/ios-release ---"; find build/ios-release -iname '*.spv'
          test -f "$app/shaders/forward.spv"
          test -f "$app/game.sbundle"
          test -f "$app/Info.plist"
          python3 -c 'import plistlib, sys; family = plistlib.load(open(sys.argv[1], "rb")).get("UIDeviceFamily"); assert family == [1, 2], f"Expected iPhone and iPad support, got {family}"' "$app/Info.plist"
          test -f "$app/sonnet_player"
