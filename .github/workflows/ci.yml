name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check docs
        run: python3 tools/check_docs.py
      - name: Check that vcpkg.json mirrors the CMake project version
        run: python3 tools/check_version.py
      - name: Check formatting
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y clang-format-20
          git ls-files '*.h' '*.cpp' | xargs clang-format-20 --dry-run --Werror
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | python3 tools/check_commit_msg.py --stdin

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            preset: linux-debug
            cc: gcc-14
            cxx: g++-14
          - name: Linux Clang
            os: ubuntu-24.04
            preset: linux-debug
            cc: clang-20
            cxx: clang++-20
          - name: Linux ASan
            os: ubuntu-24.04
            preset: linux-asan
            cc: clang-20
            cxx: clang++-20
          - name: Windows MSVC
            os: windows-latest
            preset: windows-debug
          - name: macOS Clang
            os: macos-latest
            preset: macos-debug
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Vulkan tests run on Lavapipe; the platform tests use SDL's dummy video driver.
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      SDL_VIDEO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          # kisak-mesa carries a Mesa recent enough for Lavapipe to expose Vulkan 1.4. Clang comes from
          # apt.llvm.org because Clang 18 with libstdc++ hides std::expected (docs/build.md, "Toolchains").
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 clang-20 clang-tidy-20 mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev
          vulkaninfo --summary | grep -E 'apiVersion|deviceName' || true

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows packages
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        shell: bash
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: clang-tidy on changed files
        if: matrix.name == 'Linux Clang' && github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- '*.cpp' | grep -E '^(modules|apps)/' || true)
          if [ -n "$files" ]; then
            clang-tidy-20 -p build/${{ matrix.preset }} $files
          fi
