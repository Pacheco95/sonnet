name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check docs
        run: python3 tools/check_docs.py
      - name: Check that vcpkg.json mirrors the CMake project version
        run: python3 tools/check_version.py
      - name: Check formatting
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y clang-format-20
          git ls-files '*.h' '*.cpp' | xargs clang-format-20 --dry-run --Werror
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | python3 tools/check_commit_msg.py --stdin

  build:
    name: ${{ matrix.name }}
    needs: lint
    permissions:
      contents: read
      actions: write # deletes the vcpkg binary cache entries a new one replaces
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `cache` names the job's vcpkg binary cache group. vcpkg builds every port in Debug and Release
        # whatever CMAKE_BUILD_TYPE is, and the sanitizer flags do not reach the ports, so the jobs that
        # share a triplet and a compiler share a group.
        include:
          - name: Linux GCC
            cache: linux-gcc
            os: ubuntu-24.04
            preset: linux-debug
            cc: gcc-14
            cxx: g++-14
          - name: Linux Clang
            cache: linux-clang
            os: ubuntu-24.04
            preset: linux-debug
            cc: clang-20
            cxx: clang++-20
          - name: Linux ASan
            cache: linux-clang
            os: ubuntu-24.04
            preset: linux-asan
            cc: clang-20
            cxx: clang++-20
          - name: Linux TSan
            cache: linux-tsan
            os: ubuntu-24.04
            preset: linux-tsan
            cc: clang-20
            cxx: clang++-20
          - name: Windows MSVC
            cache: windows-msvc
            os: windows-latest
            preset: windows-debug
          - name: macOS Clang
            cache: macos
            os: macos-latest
            preset: macos-debug
          # Plain Release, not the presets' RelWithDebInfo: it compiles assertions out and GCC's -O3 inlining
          # reports places -O2 does not, and warnings are errors (#36).
          - name: Linux GCC Release
            cache: linux-gcc
            os: ubuntu-24.04
            preset: linux-release
            build-type: Release
            cc: gcc-14
            cxx: g++-14
          - name: Linux Clang Release
            cache: linux-clang
            os: ubuntu-24.04
            preset: linux-release
            build-type: Release
            cc: clang-20
            cxx: clang++-20
          - name: Windows MSVC Release
            cache: windows-msvc
            os: windows-latest
            preset: windows-release
            build-type: Release
          - name: Windows clang-cl Release
            cache: windows-clang-cl
            os: windows-latest
            preset: windows-release
            build-type: Release
            cc: clang-cl
            cxx: clang-cl
          - name: macOS Clang Release
            cache: macos
            os: macos-latest
            preset: macos-release
            build-type: Release
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          # kisak-mesa carries a Mesa recent enough for Lavapipe to expose Vulkan 1.4. Clang comes from
          # apt.llvm.org because Clang 18 with libstdc++ hides std::expected (docs/build.md, "Toolchains").
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 clang-20 clang-tidy-20 libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev
          # Vulkan tests run on Lavapipe; tests that need a window use SDL's offscreen driver.
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" >> "$GITHUB_ENV"
          VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1) vulkaninfo --summary | grep -E 'apiVersion|deviceName' || true

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows packages
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        shell: bash
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's binary cache (docs/build.md, "vcpkg binary cache"): the files backend in a folder restored
      # from the newest entry of the job's group, which pull requests read from main.
      # The runner image version is part of the key: hosted runners serve two image versions at the same
      # time while one rolls out, and their compilers and SDKs give the ports different ABI hashes. The
      # runner sets `ImageVersion` as an environment variable, which expressions cannot read, so it goes
      # through GITHUB_ENV first.
      - name: Note the runner image
        shell: bash
        run: echo "RUNNER_IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-
            vcpkg-${{ matrix.cache }}-

      - name: Point vcpkg at the binary cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          touch "$RUNNER_TEMP/vcpkg-cache.marker"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.build-type && format('-DCMAKE_BUILD_TYPE={0}', matrix.build-type) || '' }}

      # Saved right after the configure that installs the ports, so a failing build or test still saves it,
      # and only from main, so pull requests cannot evict main's entries. Pruned to the archives this
      # configure used, saved only if vcpkg wrote new ones, and then the older entries of the same group
      # and runner image are deleted.
      - name: Prune the vcpkg binary cache
        id: vcpkg-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: python3 tools/prune_vcpkg_cache.py "$RUNNER_TEMP/vcpkg-cache" --since "$RUNNER_TEMP/vcpkg-cache.marker"

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the older vcpkg binary caches
        if: steps.vcpkg-cache.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: vcpkg-${{ matrix.cache }}-${{ env.RUNNER_IMAGE }}-
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" --limit 100 --json id,key)
          # Only once the new entry is there, so a save that failed does not leave the group empty.
          if jq -e --arg key "$KEY" 'any(.key == $key)' <<< "$caches" > /dev/null; then
            jq -r --arg key "$KEY" '.[] | select(.key != $key) | .id' <<< "$caches" \
              | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::$KEY is not in the cache list; keeping the older entries"
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 300

      - name: clang-tidy on changed files
        if: matrix.name == 'Linux Clang' && github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- '*.cpp' | grep -E '^(modules|apps)/' || true)
          if [ -n "$files" ]; then
            clang-tidy-20 -p build/${{ matrix.preset }} $files
          fi

  android:
    name: Android
    needs: lint
    permissions:
      contents: read
      actions: write # deletes the vcpkg binary cache entries a new one replaces
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # NDK r30 is the oldest that targets android-36, the presets' API level (docs/build.md, "Toolchains").
      # The runner's default, r27.3, stops at API 35, so r30 is installed next to it. GCC 14 and the SDL
      # headers are for the host build of sonnet_cook.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev
          ndk=30.0.16248370
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          grep Pkg.Revision "$ANDROID_HOME/ndk/$ndk/source.properties"

      # The APK takes javac, java and keytool from JAVA_HOME (docs/build.md, "Android"); pin the runner's JDK 17.
      - name: Check the JDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/javac" -version 2>&1 | tee /dev/stderr | grep -q '^javac 17\.'

      - name: Set up vcpkg
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's binary cache (docs/build.md, "vcpkg binary cache"): the files backend in a folder restored
      # from the newest entry of the job's group, which pull requests read from main.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-android-

      - name: Point vcpkg at the binary cache
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          touch "$RUNNER_TEMP/vcpkg-cache.marker"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # ADR-0018, "CI": the basic sample cooked for android by a Linux sonnet_cook, with ASTC textures.
      # Built here rather than taken from the Linux jobs, which would hold this job until the whole
      # matrix finished.
      - name: Build the host cook tool
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake --preset linux-release -DSONNET_BUILD_TESTS=OFF
          cmake --build --preset linux-release --target sonnet_cook_app

      - name: Cook the basic sample for Android
        run: build/linux-release/apps/cook/sonnet_cook apps/samples/basic --platform android --out build/android-bundle

      - name: Configure
        run: cmake --preset android-release -DSONNET_ANDROID_BUNDLE="$PWD/build/android-bundle/game.sbundle"

      # Saved right after the configure that installs the ports, so a failing build or test still saves it,
      # and only from main, so pull requests cannot evict main's entries. Pruned to the archives this
      # configure used, saved only if vcpkg wrote new ones, and then the group's older entries are deleted.
      - name: Prune the vcpkg binary cache
        id: vcpkg-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tools/prune_vcpkg_cache.py "$RUNNER_TEMP/vcpkg-cache" --since "$RUNNER_TEMP/vcpkg-cache.marker"

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-android-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the older vcpkg binary caches
        if: steps.vcpkg-cache.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: vcpkg-android-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: vcpkg-android-
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" --limit 100 --json id,key)
          # Only once the new entry is there, so a save that failed does not leave the group empty.
          if jq -e --arg key "$KEY" 'any(.key == $key)' <<< "$caches" > /dev/null; then
            jq -r --arg key "$KEY" '.[] | select(.key != $key) | .id' <<< "$caches" \
              | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::$KEY is not in the cache list; keeping the older entries"
          fi

      # The player library first, then the APK packaged from it with the cooked bundle.
      - name: Build
        run: cmake --build --preset android-release --target sonnet_player_app

      - name: Package the APK
        run: cmake --build --preset android-release --target sonnet_player_apk

      - name: Verify the APK
        run: |
          apk=build/android-release/apps/player/sonnet_player.apk
          tools="$ANDROID_HOME/build-tools/36.1.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt2" dump badging "$apk" | grep -E "^package|Sdk|vulkan|native-code"
          unzip -v "$apk" | grep -E ' Stored .* assets/game\.sbundle$'

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: sonnet_player-android
          path: build/android-release/apps/player/sonnet_player.apk
          if-no-files-found: error

  ios:
    name: iOS
    needs: lint
    permissions:
      contents: read
      actions: write # deletes the vcpkg binary cache entries a new one replaces
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS packages
        run: brew install ninja

      - name: Set up vcpkg
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's binary cache (docs/build.md, "vcpkg binary cache"): the files backend in a folder restored
      # from the newest entry of the job's group, which pull requests read from main.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-ios-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-ios-

      - name: Point vcpkg at the binary cache
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          touch "$RUNNER_TEMP/vcpkg-cache.marker"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      # Built here, as the Android job builds sonnet_cook for its own host, so the iOS job stays
      # independent of the desktop matrix. This triplet (arm64-osx) shares the "ios" cache group
      # with arm64-ios, the same way the Android job's group holds x64-linux and arm64-android.
      - name: Build the host cook tool
        run: |
          cmake --preset macos-release -DSONNET_BUILD_TESTS=OFF
          cmake --build --preset macos-release --target sonnet_cook_app

      - name: Cook the basic sample for iOS
        run: build/macos-release/apps/cook/sonnet_cook apps/samples/basic --platform ios --out build/ios-bundle

      # ADR-0018, "CI": proves the player compiles and links against MoltenVK on the device SDK,
      # with a real cooked bundle so the SONNET_IOS_BUNDLE copy step in cmake/SonnetIOS.cmake runs
      # too, not just the shaders half of it. No CMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM is set, so
      # CODE_SIGNING_ALLOWED=NO skips the codesign build phase instead of failing for want of a
      # team; there is no simulator run, since the release's iOS archive MoltenVK links has no
      # simulator slice (ports/moltenvk).
      - name: Configure
        run: cmake --preset ios-release -DSONNET_IOS_BUNDLE="$PWD/build/ios-bundle/game.sbundle"

      # Saved right after the configure that installs the ports, so a failing build still saves it,
      # and only from main, so pull requests cannot evict main's entries. Pruned to the archives this
      # configure used, saved only if vcpkg wrote new ones, and then the group's older entries are deleted.
      - name: Prune the vcpkg binary cache
        id: vcpkg-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tools/prune_vcpkg_cache.py "$RUNNER_TEMP/vcpkg-cache" --since "$RUNNER_TEMP/vcpkg-cache.marker"

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-ios-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the older vcpkg binary caches
        if: steps.vcpkg-cache.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: vcpkg-ios-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: vcpkg-ios-
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" --limit 100 --json id,key)
          # Only once the new entry is there, so a save that failed does not leave the group empty.
          if jq -e --arg key "$KEY" 'any(.key == $key)' <<< "$caches" > /dev/null; then
            jq -r --arg key "$KEY" '.[] | select(.key != $key) | .id' <<< "$caches" \
              | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::$KEY is not in the cache list; keeping the older entries"
          fi

      - name: Build
        run: cmake --build --preset ios-release --target sonnet_player_app -- CODE_SIGNING_ALLOWED=NO

      - name: Verify the app bundle
        run: |
          app=build/ios-release/apps/player/RelWithDebInfo-iphoneos/sonnet_player.app
          echo "--- $app ---"; ls -la "$app" || true
          echo "--- $app/shaders ---"; ls -la "$app/shaders" 2>&1 || true
          echo "--- every sonnet_player.app under build/ios-release ---"; find build/ios-release -iname 'sonnet_player.app'
          echo "--- every game.sbundle under build/ios-release ---"; find build/ios-release -iname 'game.sbundle'
          echo "--- every *.spv under build/ios-release ---"; find build/ios-release -iname '*.spv'
          test -f "$app/shaders/forward.spv"
          test -f "$app/game.sbundle"
          test -f "$app/Info.plist"
          test -f "$app/sonnet_player"
